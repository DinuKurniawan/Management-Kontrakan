databases:
  - name: management-kontrakan-db
    plan: free
    databaseName: management_kontrakan
    user: kontrakan_user

services:
  - type: web
    name: management-kontrakan
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Management Kontrakan"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: management-kontrakan
          property: host
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: management-kontrakan-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: management-kontrakan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: management-kontrakan-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: management-kontrakan-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: management-kontrakan-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: management-kontrakan-db
          property: password
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: PORT
        value: "10000"
